<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShiftMaster | Kurumsal Giriş Portalı</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        :root {
            --bg-dark: #050b14; 
            --bg-light: #0f172a;
            --accent: #38bdf8; 
            --accent-glow: #0284c7;
            --glass-bg: rgba(15, 23, 42, 0.6);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body { 
            margin: 0; padding: 0; display: flex; height: 100vh; 
            font-family: 'Poppins', sans-serif; background: var(--bg-dark); 
            color: white; overflow: hidden;
        }

        /* ✨ SOL TARAF: SİNEMATİK SLAYT EKRANI ✨ */
        .slider-section { flex: 1.2; position: relative; box-shadow: 15px 0 40px rgba(0,0,0,0.9); z-index: 10; overflow: hidden; background-color: var(--bg-dark); }
        .slide { position: absolute; inset: 0; opacity: 0; transition: opacity 1.2s ease-in-out; background-size: contain; background-position: center; background-repeat: no-repeat; filter: contrast(1.15) saturate(1.15) brightness(1.05); }
        .slide.active { opacity: 1; }
        .slide-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(5,11,20,1) 2%, rgba(15,23,42,0.1) 40%, rgba(5,11,20,0.4) 100%); }
        .slide-text-box { position: absolute; bottom: 8%; left: 8%; right: 8%; background: var(--glass-bg); backdrop-filter: blur(15px); padding: 35px 40px; border-radius: 20px; border-left: 6px solid var(--accent); box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 2px 2px 10px rgba(255,255,255,0.05); transform: translateY(30px); opacity: 0; transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .slide.active .slide-text-box { transform: translateY(0); opacity: 1; transition-delay: 0.5s; }
        .slide-title { font-size: 32px; color: var(--accent); font-weight: 900; margin: 0 0 15px 0; text-transform: uppercase; letter-spacing: 1px; text-shadow: 0 0 20px var(--accent-glow); }
        .slide-desc { font-size: 16px; color: #e2e8f0; line-height: 1.8; margin: 0; font-weight: 300; }
        .indicators { position: absolute; bottom: 3%; left: 50%; transform: translateX(-50%); display: flex; gap: 15px; }
        .dot { width: 14px; height: 14px; border-radius: 50%; background: rgba(255,255,255,0.2); cursor: pointer; transition: 0.4s; border: 2px solid transparent; }
        .dot.active { background: var(--accent); transform: scale(1.5); border-color: rgba(255,255,255,0.4); box-shadow: 0 0 15px var(--accent); }

        /* ✨ SAĞ TARAF: GİRİŞ VE KAYIT EKRANI ✨ */
        .login-section { flex: 1; display: flex; flex-direction: column; align-items: center; background: radial-gradient(circle at top right, var(--bg-light), var(--bg-dark)); padding: 20px 40px; overflow-y: auto; }
        .login-section::-webkit-scrollbar { width: 6px; }
        .login-section::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }
        
        .login-header { text-align: center; margin-bottom: 20px; margin-top: 20px; }
        .app-logo { width: 60px; height: 60px; background: linear-gradient(135deg, var(--accent), var(--accent-glow)); border-radius: 20px; display: inline-flex; justify-content: center; align-items: center; box-shadow: 0 0 30px rgba(56, 189, 248, 0.4), inset 2px 2px 5px rgba(255,255,255,0.4); margin-bottom: 10px; }

        .login-card { background: var(--glass-bg); backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-bottom: 1px solid rgba(0,0,0,0.5); border-right: 1px solid rgba(0,0,0,0.5); padding: 30px; border-radius: 25px; width: 100%; max-width: 400px; box-shadow: 10px 10px 40px rgba(0,0,0,0.6); }

        .tab-container { display: flex; background: rgba(0,0,0,0.4); border-radius: 15px; margin-bottom: 25px; padding: 5px; border: 1px solid rgba(255,255,255,0.05); }
        .tab-btn { flex: 1; padding: 12px; text-align: center; font-weight: 800; font-size: 13px; color: #64748b; cursor: pointer; border-radius: 12px; transition: 0.3s; letter-spacing: 1px; }
        .tab-btn.active { background: linear-gradient(135deg, #0ea5e9, #0284c7); color: white; box-shadow: 0 5px 15px rgba(56, 189, 248, 0.4); }

        .form-area { display: none; animation: fadeIn 0.4s; }
        .form-area.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .input-group { margin-bottom: 15px; }
        .input-row { display: flex; gap: 10px; }
        .input-row .input-group { flex: 1; }
        .input-label { display: block; font-size: 10px; font-weight: 800; color: #94a3b8; margin-bottom: 6px; letter-spacing: 1px;}
        
        .glass-input { width: 100%; box-sizing: border-box; background: rgba(15, 23, 42, 0.5); border-top: 1px solid rgba(0,0,0,0.6); border-left: 1px solid rgba(0,0,0,0.6); border-bottom: 1px solid var(--glass-border); border-right: 1px solid var(--glass-border); color: white; padding: 12px 15px; border-radius: 12px; outline: none; font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 13px; transition: 0.3s; box-shadow: inset 3px 3px 8px rgba(0,0,0,0.6); }
        .glass-input:focus { border-color: var(--accent); box-shadow: inset 2px 2px 5px rgba(0,0,0,0.8), 0 0 15px var(--glass-glow); background: rgba(15, 23, 42, 0.8); }

        .btn-action { width: 100%; padding: 15px; border: none; border-radius: 12px; font-family: 'Poppins', sans-serif; font-weight: 900; font-size: 14px; cursor: pointer; background: linear-gradient(135deg, #10b981, #059669); color: white; transition: all 0.3s; text-transform: uppercase; letter-spacing: 1px; box-shadow: inset 2px 2px 5px rgba(255,255,255,0.3), 0 5px 15px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); margin-top: 10px; }
        .btn-action:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 10px 25px rgba(16, 185, 129, 0.5); }
        .btn-login { background: linear-gradient(135deg, #0ea5e9, #0284c7); }
    </style>
</head>
<body>

    <div class="slider-section">
        <div class="slide active" style="background-image: url('ZZZZZZZZ.jpg');">
            <div class="slide-overlay"></div>
            <div class="slide-text-box"><h2 class="slide-title">VARDİYA İŞKENCE OLMASIN!</h2><p class="slide-desc">ShiftMaster ile saniyeler içinde planlama yapın.</p></div>
        </div>
        <div class="indicators">
            <div class="dot active" onclick="goToSlide(0)"></div>
        </div>
    </div>

    <div class="login-section">
        <div class="login-header">
            <div class="app-logo">SM</div>
            <h1 style="margin: 0;">SHIFT<span style="color: var(--accent);">MASTER</span></h1>
        </div>

        <div class="login-card">
            <div class="tab-container">
                <div class="tab-btn active" id="tabGiris" onclick="switchTab('giris')">GİRİŞ YAP</div>
                <div class="tab-btn" id="tabKayit" onclick="switchTab('kayit')">YENİ KAYIT</div>
            </div>

            <div id="formGiris" class="form-area active">
                <div class="input-group">
                    <label class="input-label">E-POSTA ADRESİ</label>
                    <input type="email" id="loginEmail" class="glass-input" placeholder="mail@ornek.com">
                </div>
                <div class="input-group">
                    <label class="input-label">ŞİFRE</label>
                    <input type="password" id="loginSifre" class="glass-input" placeholder="••••••••">
                </div>
                <button onclick="girisYapFirebase()" class="btn-action btn-login">SİSTEME GİRİŞ YAP</button>
            </div>

            <div id="formKayit" class="form-area">
                <div class="input-group">
                    <label class="input-label">KURUM ADI (ZORUNLU)</label>
                    <input type="text" id="regKurumAd" class="glass-input" placeholder="Örn: Yıldız Eczanesi">
                </div>
                <div class="input-group">
                    <label class="input-label">E-MAİL ADRESİ</label>
                    <input type="email" id="regEmail" class="glass-input" placeholder="mail@ornek.com">
                </div>
                <div class="input-row">
                    <div class="input-group">
                        <label class="input-label">ŞİFRE</label>
                        <input type="password" id="regSifre1" class="glass-input" placeholder="••••••••">
                    </div>
                    <div class="input-group">
                        <label class="input-label">ŞİFRE TEKRAR</label>
                        <input type="password" id="regSifre2" class="glass-input" placeholder="••••••••">
                    </div>
                </div>
                <button onclick="kayitOlFirebase()" class="btn-action">HESABI OLUŞTUR VE DOĞRULA</button>
            </div>
        </div>
    </div>

    <script>
        // 🔥 FIREBASE YAPILANDIRMASI (Tespit edilen verilere göre)
        const firebaseConfig = {
            apiKey: "AIzaSyAAqT74kCwyr6ZULTR_ClRDJ5Iu4AhmXJQ", // Tespit edilen API Anahtarın 
            authDomain: "shiftmaster1-7fc5f.firebaseapp.com",
            projectId: "shiftmaster1-7fc5f",
            storageBucket: "shiftmaster1-7fc5f.appspot.com",
            messagingSenderId: "Gerekli_Degil",
            appId: "Gerekli_Degil"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // KAYIT MOTORU (Mail Doğrulama Dahil)
        function kayitOlFirebase() {
            const email = document.getElementById("regEmail").value;
            const sifre = document.getElementById("regSifre1").value;
            const kurum = document.getElementById("regKurumAd").value;

            if(!email || !sifre || !kurum) { alert("Lütfen tüm alanları doldurun!"); return; }

            auth.createUserWithEmailAndPassword(email, sifre)
                .then((userCredential) => {
                    // Kullanıcı oluşturuldu, şimdi mail doğrulama gönder
                    userCredential.user.sendEmailVerification().then(() => {
                        alert("Kayıt başarılı! Lütfen " + email + " adresine gelen doğrulama linkine tıklayın.");
                        switchTab('giris');
                    });
                })
                .catch((error) => alert("Hata: " + error.message));
        }

        // GİRİŞ MOTORU (Doğrulama Kontrolü Dahil)
        function girisYapFirebase() {
            const email = document.getElementById("loginEmail").value;
            const sifre = document.getElementById("loginSifre").value;

            auth.signInWithEmailAndPassword(email, sifre)
                .then((userCredential) => {
                    if (userCredential.user.emailVerified) {
                        localStorage.setItem('sm_active_user', email);
                        window.location.href = "shiftmaster.html";
                    } else {
                        alert("Lütfen önce e-posta adresinizi doğrulayın!");
                        auth.signOut();
                    }
                })
                .catch((error) => alert("Giriş Hatası: " + error.message));
        }

        function switchTab(t) {
            document.querySelectorAll('.tab-btn, .form-area').forEach(el => el.classList.remove('active'));
            document.getElementById('tab' + t.charAt(0).toUpperCase() + t.slice(1)).classList.add('active');
            document.getElementById('form' + t.charAt(0).toUpperCase() + t.slice(1)).classList.add('active');
        }
    </script>
</body>
</html>
