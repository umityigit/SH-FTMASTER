<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="ShiftMaster - Profesyonel Vardiya, Nöbet ve Puantaj Yönetim Sistemi.">
    <title>ShiftMaster | Kurumsal Giriş Portalı</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6058377876424598" crossorigin="anonymous"></script>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        * { max-width: 100%; box-sizing: border-box; }
        :root { --bg-dark: #050b14; --bg-light: #0f172a; --accent: #38bdf8; --accent-glow: #0284c7; --glass-bg: rgba(15, 23, 42, 0.6); --glass-border: rgba(255, 255, 255, 0.1); }
        
        /* 📱 DİKEY DÜZEN AYARI */
        body { 
            margin: 0; padding: 0; 
            display: flex; 
            flex-direction: column; /* Üst üste diz */
            background: var(--bg-dark); 
            color: white; 
            min-height: 100vh;
            overflow-x: hidden; 
        }

        /* ✨ SLAYT BÖLÜMÜ (ÜSTTE) ✨ */
        .slider-section { 
            width: 100%; 
            height: 45vh; /* Ekranın yarısına yakını slayt */
            position: relative; 
            z-index: 10; 
            overflow: hidden; 
        }
        .slide { position: absolute; inset: 0; opacity: 0; transition: opacity 1.2s ease-in-out; background-size: cover; background-position: center; }
        .slide.active { opacity: 1; }
        .slide-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(5,11,20,1) 0%, rgba(15,23,42,0.1) 100%); }
        .slide-text-box { position: absolute; bottom: 15%; left: 5%; right: 5%; background: var(--glass-bg); backdrop-filter: blur(10px); padding: 20px; border-radius: 15px; border-left: 5px solid var(--accent); }
        .slide-title { font-size: 20px; color: var(--accent); font-weight: 900; margin-bottom: 5px; }
        .slide-desc { font-size: 13px; color: #e2e8f0; line-height: 1.4; margin: 0; }
        .indicators { position: absolute; bottom: 5%; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.2); cursor: pointer; }
        .dot.active { background: var(--accent); transform: scale(1.3); }

        /* 💰 REKLAM ALANI (ORTADA) 💰 */
        .ad-container {
            width: 100%;
            max-width: 1000px;
            margin: 20px auto;
            padding: 10px;
            background: rgba(0,0,0,0.2);
            text-align: center;
        }

        /* ✨ GİRİŞ BÖLÜMÜ (ALTTA) ✨ */
        .login-section { 
            width: 100%; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 20px; 
            background: radial-gradient(circle at top, var(--bg-light), var(--bg-dark));
        }
        .login-card { background: var(--glass-bg); backdrop-filter: blur(20px); border: 1px solid var(--glass-border); padding: 25px; border-radius: 25px; width: 100%; max-width: 400px; }
        
        /* Form elemanları aynı kalıyor... */
        .tab-container { display: flex; background: rgba(0,0,0,0.4); border-radius: 12px; margin-bottom: 20px; padding: 5px; }
        .tab-btn { flex: 1; padding: 10px; text-align: center; font-weight: 800; font-size: 12px; color: #64748b; cursor: pointer; border-radius: 10px; }
        .tab-btn.active { background: linear-gradient(135deg, #0ea5e9, #0284c7); color: white; }
        .form-area { display: none; }
        .form-area.active { display: block; }
        .input-group { margin-bottom: 15px; }
        .input-label { display: block; font-size: 10px; font-weight: 800; color: #94a3b8; margin-bottom: 5px; }
        .glass-input { width: 100%; background: rgba(15, 23, 42, 0.5); border: 1px solid var(--glass-border); color: white; padding: 12px; border-radius: 10px; outline: none; }
        .btn-action { width: 100%; padding: 14px; border: none; border-radius: 10px; font-weight: 900; cursor: pointer; background: linear-gradient(135deg, #0ea5e9, #0284c7); color: white; text-transform: uppercase; }
        .seo-footer { margin-top: 30px; text-align: center; font-size: 10px; color: #64748b; max-width: 400px; }
    </style>
</head>
<body>

    <div class="slider-section">
        <div class="slide active" style="background-image: url('ZZZZZZZZ.jpg');">
            <div class="slide-overlay"></div>
            <div class="slide-text-box">
                <h2 class="slide-title">VARDİYA HAZIRLAMAK İŞKENCE OLMASIN!</h2>
                <p class="slide-desc">Saniyeler içinde kusursuz planlar hazırlayın, karmaşaya son verin.</p>
            </div>
        </div>
        <div class="indicators">
            <div class="dot active" onclick="goToSlide(0)"></div>
            </div>
    </div>

    <div class="ad-container">
        <ins class="adsbygoogle"
             style="display:block"
             data-ad-client="ca-pub-6058377876424598"
             data-ad-slot="4525356602"
             data-ad-format="auto"
             data-full-width-responsive="true"></ins>
        <script> (adsbygoogle = window.adsbygoogle || []).push({}); </script>
    </div>

    <div class="login-section">
        <div class="login-card">
            <div class="tab-container">
                <div class="tab-btn active" id="tabGiris" onclick="switchTab('giris')">GİRİŞ YAP</div>
                <div class="tab-btn" id="tabKayit" onclick="switchTab('kayit')">KURUM KAYDI</div>
            </div>

            <div id="formGiris" class="form-area active">
                <div class="input-group">
                    <label class="input-label">KURUM KODU</label>
                    <input type="text" id="loginKurumKod" class="glass-input" placeholder="addh">
                </div>
                <div class="input-group">
                    <label class="input-label">ŞİFRE</label>
                    <input type="password" id="loginSifre" class="glass-input" placeholder="••••••••">
                </div>
                <button onclick="sihirliGirisYap()" class="btn-action">SİSTEME GİRİŞ YAP</button>
            </div>
            </div>

        <div class="seo-footer">
            <p>© 2026 ShiftMaster - Google Cloud & Firebase Güvencesiyle.</p>
        </div>
    </div>

    <script>
        // Slayt ve Giriş fonksiyonların buraya gelecek (Eski kodundakileri buraya yapıştırabilirsin)
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');
        function showSlide(index) { slides.forEach(s => s.classList.remove('active')); slides[index].classList.add('active'); }
        setInterval(() => { currentSlide = (currentSlide + 1) % slides.length; showSlide(currentSlide); }, 5000);

        function switchTab(t) {
            document.querySelectorAll('.tab-btn, .form-area').forEach(el => el.classList.remove('active'));
            document.getElementById('tab' + t.charAt(0).toUpperCase() + t.slice(1)).classList.add('active');
            document.getElementById('form' + t.charAt(0).toUpperCase() + t.slice(1)).classList.add('active');
        }
        
        // Firebase ve Giriş yapma kodlarını buraya eklemeyi unutma Ümit Abi!
    </script>
</body>
</html>
