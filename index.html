<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ShiftMaster | Kurumsal Giriş Portalı</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6058377876424598" crossorigin="anonymous"></script>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        * { max-width: 100%; box-sizing: border-box; }
        :root { --bg-dark: #050b14; --bg-light: #0f172a; --accent: #38bdf8; --accent-glow: #0284c7; --glass-bg: rgba(15, 23, 42, 0.6); --glass-border: rgba(255, 255, 255, 0.1); }
        
        body { margin: 0; padding: 0; display: flex; height: 100vh; font-family: 'Poppins', sans-serif; background: var(--bg-dark); color: white; overflow: hidden; }

        /* ✨ SOL TARAF: SLAYT VE REKLAM KONTEYNERI */
        .left-content { 
            flex: 1.3; 
            display: flex; 
            flex-direction: column; /* Slayt ve reklamı alt alta diz */
            height: 100vh;
            border-right: 1px solid var(--glass-border);
        }

        /* 🖼️ SLAYTI BİRAZ YUKARI ÇEKTİK */
        .slider-section { 
            flex: 1; /* Kalan alanı doldur */
            position: relative; 
            overflow: hidden; 
            background-color: var(--bg-dark); 
        }

        .slide { position: absolute; inset: 0; opacity: 0; transition: opacity 1.2s ease-in-out; background-size: cover; background-position: center; background-repeat: no-repeat; }
        .slide.active { opacity: 1; }
        .slide-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(5,11,20,1) 5%, rgba(15,23,42,0.1) 50%); }
        
        .slide-text-box { 
            position: absolute; bottom: 10%; left: 8%; right: 8%; 
            background: var(--glass-bg); backdrop-filter: blur(15px); 
            padding: 25px; border-radius: 20px; border-left: 6px solid var(--accent);
            transform: translateY(20px); opacity: 0; transition: 0.8s;
        }
        .slide.active .slide-text-box { transform: translateY(0); opacity: 1; }
        .slide-title { font-size: 26px; color: var(--accent); font-weight: 900; margin: 0 0 10px 0; }
        .slide-desc { font-size: 14px; color: #e2e8f0; line-height: 1.6; margin: 0; }

        /* 💰 REKLAMI SLAYTIN ALTINA SIĞDIRDIK */
        .ad-footer-area {
            height: 110px; /* Reklam için sabit yükseklik */
            background: rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5px;
            overflow: hidden;
        }

        /* ✨ SAĞ TARAF: GİRİŞ (AYNI KALDI) */
        .login-section { flex: 1; display: flex; flex-direction: column; align-items: center; background: radial-gradient(circle at top right, var(--bg-light), var(--bg-dark)); padding: 40px; overflow-y: auto; }
        .login-card { background: var(--glass-bg); backdrop-filter: blur(20px); border: 1px solid var(--glass-border); padding: 30px; border-radius: 25px; width: 100%; max-width: 420px; box-shadow: 10px 10px 40px rgba(0,0,0,0.6); }

        .tab-container { display: flex; background: rgba(0,0,0,0.4); border-radius: 15px; margin-bottom: 25px; padding: 5px; }
        .tab-btn { flex: 1; padding: 12px; text-align: center; font-weight: 800; font-size: 13px; color: #64748b; cursor: pointer; border-radius: 12px; transition: 0.3s; }
        .tab-btn.active { background: linear-gradient(135deg, #0ea5e9, #0284c7); color: white; }

        .form-area { display: none; }
        .form-area.active { display: block; }
        .input-group { margin-bottom: 15px; }
        .input-label { display: block; font-size: 10px; font-weight: 800; color: #94a3b8; margin-bottom: 6px; letter-spacing: 1px;}
        .glass-input { width: 100%; background: rgba(15, 23, 42, 0.5); border: 1px solid var(--glass-border); color: white; padding: 15px; border-radius: 12px; outline: none; }
        .btn-action { width: 100%; padding: 16px; border: none; border-radius: 12px; font-weight: 900; font-size: 14px; cursor: pointer; background: linear-gradient(135deg, #0ea5e9, #0284c7); color: white; text-transform: uppercase; }

        .indicators { position: absolute; bottom: 3%; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; background: rgba(255,255,255,0.2); cursor: pointer; }
        .dot.active { background: var(--accent); transform: scale(1.3); }

        @media (max-width: 900px) { body { flex-direction: column; overflow: auto; } .left-content { height: 50vh; flex: none; } }
    </style>
</head>
<body>

    <div class="left-content">
        <div class="slider-section">
            <div class="slide active" style="background-image: url('ZZZZZZZZ.jpg');">
                <div class="slide-overlay"></div>
                <div class="slide-text-box">
                    <h2 class="slide-title">VARDİYA HAZIRLAMAK İŞKENCE OLMASIN!</h2>
                    <p class="slide-desc">Saniyeler içinde kusursuz planlar hazırlayın, karmaşaya son verin.</p>
                </div>
            </div>
            <div class="slide" style="background-image: url('SSAAAAAAAA.jpg');">
                <div class="slide-overlay"></div>
                <div class="slide-text-box" style="border-left-color: #facc15;">
                    <h2 class="slide-title">7/24 KESİNTİSİZ KONTROL SİZDE!</h2>
                    <p class="slide-desc">İster cepten, ister tabletten... Sisteminiz daima elinizin altında.</p>
                </div>
            </div>
            <div class="indicators">
                <div class="dot active" onclick="goToSlide(0)"></div>
                <div class="dot" onclick="goToSlide(1)"></div>
            </div>
        </div>

        <div class="ad-footer-area">
            <ins class="adsbygoogle"
                 style="display:inline-block;width:100%;height:90px"
                 data-ad-client="ca-pub-6058377876424598"
                 data-ad-slot="4525356602"></ins>
            <script> (adsbygoogle = window.adsbygoogle || []).push({}); </script>
        </div>
    </div>

    <div class="login-section">
        <div class="login-header" style="text-align: center; margin-bottom: 20px;">
             <h1 style="margin: 0; font-size: 28px; font-weight: 900;">SHIFT<span style="color: var(--accent);">MASTER</span></h1>
             <p style="color: #64748b; margin: 0; font-size: 11px; font-weight: 600; letter-spacing: 3px;">KURUMSAL GİRİŞ PORTALI</p>
        </div>

        <div class="login-card">
            <div class="tab-container">
                <div class="tab-btn active" id="tabGiris" onclick="switchTab('giris')">GİRİŞ YAP</div>
                <div class="tab-btn" id="tabKayit" onclick="switchTab('kayit')">KURUM KAYDI</div>
            </div>

            <div id="formGiris" class="form-area active">
                <div class="input-group">
                    <label class="input-label">KURUM KODU</label>
                    <input type="text" id="loginKurumKod" class="glass-input" placeholder="addh">
                </div>
                <div class="input-group">
                    <label class="input-label">ŞİFRE</label>
                    <input type="password" id="loginSifre" class="glass-input" placeholder="••••••••">
                </div>
                <button onclick="sihirliGirisYap()" class="btn-action">SİSTEME GİRİŞ YAP</button>
            </div>
        </div>
    </div>

    <script>
        // Slayt Motoru
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');
        const dots = document.querySelectorAll('.dot');
        function showSlide(index) { slides.forEach(s => s.classList.remove('active')); dots.forEach(d => d.classList.remove('active')); slides[index].classList.add('active'); dots[index].classList.add('active'); }
        setInterval(() => { currentSlide = (currentSlide + 1) % slides.length; showSlide(currentSlide); }, 5000);
        function goToSlide(index) { currentSlide = index; showSlide(currentSlide); }

        function switchTab(t) {
            document.querySelectorAll('.tab-btn, .form-area').forEach(el => el.classList.remove('active'));
            document.getElementById('tab' + t.charAt(0).toUpperCase() + t.slice(1)).classList.add('active');
            document.getElementById('form' + t.charAt(0).toUpperCase() + t.slice(1)).classList.add('active');
        }

        // Firebase ve Giriş kodlarını buraya eklemeyi unutma abi!
    </script>
</body>
</html>
