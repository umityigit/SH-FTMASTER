<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aİ MASTER | Bulut Not Defteri</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>

    <style>
        :root { --bg-dark: #0f172a; --bg-light: #1e293b; --accent: #38bdf8; --success: #10b981; --danger: #f43f5e; --text: #f8fafc; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg-dark); color: var(--text); margin: 0; padding: 20px; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; }
        
        .header { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.4); padding: 15px 25px; border-radius: 15px; border: 1px solid rgba(56, 189, 248, 0.3); margin-bottom: 20px; flex-shrink: 0; }
        .btn { padding: 10px 20px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; color: white; transition: 0.3s; font-family: 'Poppins', sans-serif; display: flex; align-items: center; gap: 8px;}
        .btn:hover { transform: translateY(-2px); filter: brightness(1.2); }
        .btn-cyan { background: linear-gradient(135deg, #0ea5e9, #0369a1); }
        .btn-success { background: linear-gradient(135deg, #10b981, #047857); }
        .btn-danger { background: linear-gradient(135deg, #f43f5e, #9f1239); }
        .btn-dark { background: #334155; }

        .container { display: flex; gap: 20px; flex: 1; min-height: 0; }
        
        /* Sol Menü - Not Listesi */
        .sidebar { width: 300px; background: var(--bg-light); border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; overflow: hidden; }
        .sidebar-header { padding: 15px; background: rgba(0,0,0,0.2); border-bottom: 1px solid rgba(255,255,255,0.05); text-align: center; }
        .note-list { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
        .note-list::-webkit-scrollbar { width: 6px; } .note-list::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }
        
        .note-item { padding: 12px 15px; background: rgba(0,0,0,0.3); border-radius: 10px; cursor: pointer; border-left: 4px solid transparent; transition: 0.2s; }
        .note-item:hover { background: rgba(56, 189, 248, 0.1); }
        .note-item.active { border-left-color: var(--accent); background: rgba(56, 189, 248, 0.2); }
        .note-title { font-weight: bold; font-size: 14px; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .note-date { font-size: 10px; color: #94a3b8; }

        /* Sağ Alan - Editör */
        .editor-area { flex: 1; background: var(--bg-light); border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; overflow: hidden; }
        .editor-header { display: flex; padding: 15px; gap: 15px; background: rgba(0,0,0,0.2); border-bottom: 1px solid rgba(255,255,255,0.05); }
        .title-input { flex: 1; background: rgba(0,0,0,0.5); border: 1px solid rgba(56, 189, 248, 0.3); color: white; padding: 10px 15px; border-radius: 8px; font-size: 16px; font-weight: bold; font-family: 'Poppins', sans-serif; outline: none; }
        .title-input:focus { border-color: var(--accent); }
        
        /* Kod ve Metin Kutusu */
        .content-input { flex: 1; background: #0f172a; border: none; color: #e2e8f0; padding: 20px; font-size: 14px; font-family: 'Courier New', Courier, monospace; /* Kodlar için özel font */ line-height: 1.6; resize: none; outline: none; }
        .content-input::-webkit-scrollbar { width: 8px; } .content-input::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
        
        #toast { visibility: hidden; position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: var(--success); color: white; padding: 15px 30px; border-radius: 30px; font-weight: bold; z-index: 9999; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s forwards; }
        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }
    </style>
</head>
<body>

    <div class="header">
        <div style="display:flex; align-items:center; gap: 15px;">
            <span style="font-size:28px;">📝</span>
            <div>
                <div style="font-size:20px; font-weight:900; color:var(--accent); letter-spacing: 1px;">BULUT NOT DEFTERİ</div>
                <div style="font-size:11px; color:#cbd5e1;">(HTML, CSS, JS ve Metin Arşivi)</div>
            </div>
        </div>
        <button class="btn btn-dark" onclick="window.history.back()">🔙 SHİFTMASTER'A DÖN</button>
    </div>

    <div class="container">
        <div class="sidebar">
            <div class="sidebar-header">
                <button class="btn btn-cyan" style="width:100%; justify-content:center;" onclick="createNewNote()">➕ YENİ NOT EKLE</button>
            </div>
            <div class="note-list" id="noteList">
                <div style="text-align:center; padding:20px; color:#64748b; font-size:12px;">Notlar yükleniyor...</div>
            </div>
        </div>

        <div class="editor-area">
            <div class="editor-header">
                <input type="text" id="noteTitle" class="title-input" placeholder="Not veya Kod Başlığı...">
                <button class="btn btn-dark" onclick="copyContent()" title="İçeriği Kopyala">📋 KOPYALA</button>
                <button class="btn btn-danger" id="btnDelete" onclick="deleteNote()" style="display:none;">🗑️ SİL</button>
                <button class="btn btn-success" onclick="saveNote()">💾 KAYDET</button>
            </div>
            <textarea id="noteContent" class="content-input" placeholder="Notlarınızı veya HTML/JS kodlarınızı buraya yapıştırın... (Kodlar çalıştırılmadan güvenle saklanacaktır)"></textarea>
        </div>
    </div>

    <div id="toast">İşlem Başarılı!</div>

    <script>
        // 🔥 FIREBASE BAĞLANTISI 🔥
        const firebaseConfig = { 
            apiKey: "AIzaSyAAqT74kCwyr6ZULTR_ClRDJ5Iu4AhmXJQ", 
            databaseURL: "https://shiftmaster1-7fc5f-default-rtdb.europe-west1.firebasedatabase.app", 
            projectId: "shiftmaster1-7fc5f" 
        };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.database();

        // 🔥 TENANT (KURUM) ZIRHI 🔥
        const tenantId = localStorage.getItem('sm_current_tenant') || "addh";
        const notesRef = db.ref("kurumlar/" + tenantId + "/bulut_notlar");

        let currentNoteId = null;
        let allNotes = {};

        // Sayfa açıldığında notları getir
        window.onload = () => {
            loadNotes();
        };

        function loadNotes() {
            notesRef.on('value', snap => {
                const listDiv = document.getElementById('noteList');
                listDiv.innerHTML = '';
                allNotes = snap.val() || {};

                const noteKeys = Object.keys(allNotes);
                if (noteKeys.length === 0) {
                    listDiv.innerHTML = '<div style="text-align:center; padding:20px; color:#64748b; font-size:12px;">Henüz hiç not yok.</div>';
                    return;
                }

                // Yeniden eskiye sıralama (Tarihe göre)
                noteKeys.sort((a, b) => b - a).forEach(key => {
                    let note = allNotes[key];
                    let isActive = (key === currentNoteId) ? "active" : "";
                    listDiv.innerHTML += `
                        <div class="note-item ${isActive}" onclick="openNote('${key}')">
                            <div class="note-title">${note.baslik || 'İsimsiz Not'}</div>
                            <div class="note-date">${note.tarih || ''}</div>
                        </div>
                    `;
                });
            });
        }

        function createNewNote() {
            currentNoteId = null;
            document.getElementById('noteTitle').value = "";
            document.getElementById('noteContent').value = "";
            document.getElementById('btnDelete').style.display = "none";
            
            // Aktif seçimi kaldır
            document.querySelectorAll('.note-item').forEach(el => el.classList.remove('active'));
            document.getElementById('noteTitle').focus();
        }

        function openNote(id) {
            currentNoteId = id;
            let note = allNotes[id];
            
            document.getElementById('noteTitle').value = note.baslik || "";
            document.getElementById('noteContent').value = note.icerik || "";
            document.getElementById('btnDelete').style.display = "flex";

            // Aktif seçimi renklendir
            document.querySelectorAll('.note-item').forEach(el => el.classList.remove('active'));
            event.currentTarget.classList.add('active');
        }

        function saveNote() {
            let baslik = document.getElementById('noteTitle').value.trim();
            let icerik = document.getElementById('noteContent').value; // Kodları bozmamak için trim() yapmıyoruz

            if(!baslik) {
                baslik = "İsimsiz Not " + new Date().toLocaleTimeString('tr-TR', {hour: '2-digit', minute:'2-digit'});
                document.getElementById('noteTitle').value = baslik;
            }

            // Eğer yeni notsa yeni ID(zaman damgası) oluştur, yoksa olanı güncelle
            let idToSave = currentNoteId ? currentNoteId : Date.now().toString();

            notesRef.child(idToSave).set({
                baslik: baslik,
                icerik: icerik,
                tarih: new Date().toLocaleString('tr-TR')
            }).then(() => {
                currentNoteId = idToSave;
                document.getElementById('btnDelete').style.display = "flex";
                showToast("Not Başarıyla Kaydedildi! 💾");
            }).catch(err => {
                alert("Hata: " + err.message);
            });
        }

        function deleteNote() {
            if(!currentNoteId) return;
            if(confirm("Bu notu kalıcı olarak silmek istediğinize emin misiniz?")) {
                notesRef.child(currentNoteId).remove().then(() => {
                    showToast("Not Silindi! 🗑️");
                    createNewNote();
                });
            }
        }

        function copyContent() {
            let content = document.getElementById('noteContent');
            content.select();
            content.setSelectionRange(0, 99999); // Mobiller için
            navigator.clipboard.writeText(content.value).then(() => {
                showToast("Kodlar Kopyalandı! 📋");
            }).catch(err => {
                document.execCommand("copy"); // Eski tarayıcılar için yedek
                showToast("Kodlar Kopyalandı! 📋");
            });
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.className = "show";
            setTimeout(() => { t.className = t.className.replace("show", ""); }, 3000);
        }
    </script>
</body>
</html>
