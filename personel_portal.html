<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Personel Vardiya Portalı</title>
    <script>
        // ==========================================
        // 🛡️ DEVASA F12, CTRL+U VE SAĞ TIK KİLİDİ 
        // ==========================================
        (function() {
            window.addEventListener('keydown', function(e) {
                // F12, Ctrl+Shift+I, Ctrl+U ve Ctrl+S tuşlarını en üst düzeyde engeller
                if (e.key === 'F12' || 
                   (e.ctrlKey && e.shiftKey && ['I','J','C','i','j','c'].includes(e.key)) || 
                   (e.ctrlKey && (e.key === 'U' || e.key === 'u')) || 
                   (e.ctrlKey && (e.key === 'S' || e.key === 's'))) {
                    e.preventDefault();
                    e.stopPropagation();
                    return false;
                }
            }, { capture: true });

            // Sadece hücrelere ve isimlere sağ tıklamaya izin ver, geri kalan her yeri kilitle
            window.addEventListener('contextmenu', function(e) {
                if (e.target.closest('.shift-cell') || e.target.closest('th') || e.target.closest('.editable-name') || e.target.closest('.veri-tablosu') || e.target.closest('.table-wrapper')) {
                    return; 
                }
                e.preventDefault();
            }, { capture: true });
        })();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>

    <style>
        :root { --bg: #0f172a; --card: rgba(30, 41, 59, 0.7); --accent: #38bdf8; --text: #f8fafc; --purple: #8b5cf6; }
        body { margin: 0; padding: 0; font-family: 'Poppins', sans-serif; background: radial-gradient(circle at top right, #1e293b, #050b14); color: var(--text); min-height: 100vh; }
        
        #loginScreen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        .login-box { background: rgba(15,23,42,0.8); padding: 40px; border-radius: 20px; border: 1px solid var(--accent); box-shadow: 0 0 30px rgba(56,189,248,0.2); width: 90%; max-width: 350px; text-align: center; backdrop-filter: blur(10px); }
        .glass-input { width: 100%; box-sizing: border-box; background: rgba(0,0,0,0.4); border: 1px solid #475569; padding: 15px; border-radius: 10px; color: white; margin-bottom: 20px; font-family: 'Poppins'; outline: none; text-align: center; font-size: 16px; font-weight: 600; }
        .glass-input:focus { border-color: var(--accent); box-shadow: inset 0 0 10px rgba(56,189,248,0.2); }
        .btn { background: linear-gradient(135deg, #0ea5e9, #0284c7); color: white; width: 100%; padding: 15px; border: none; border-radius: 10px; font-weight: 900; font-size: 16px; cursor: pointer; transition: 0.3s; }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(2,132,199,0.5); }

        #dashboard { display: none; padding: 20px; max-width: 1400px; margin: 0 auto; }
        .header { display: flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between; border-bottom: 1px dashed var(--accent); padding-bottom: 20px; margin-bottom: 30px; }
        
        .table-wrapper { background: var(--card); border: 1px solid #475569; border-radius: 15px; padding: 20px; margin-bottom: 30px; overflow-x: auto; }
        .table-title { font-size: 20px; font-weight: 900; color: var(--accent); margin-bottom: 15px; display: inline-block; }
        table { border-collapse: collapse; width: max-content; }
        th, td { border: 1px solid rgba(255,255,255,0.1); padding: 10px; text-align: center; font-size: 12px; font-weight: 600; }
        th { background: rgba(0,0,0,0.5); color: var(--accent); position: sticky; top: 0; }
        td:nth-child(1) { position: sticky; left: 0; background: #1e293b; font-weight: 800; border-right: 2px solid var(--accent); }

        @keyframes pulseAlert { 0% { transform: scale(1); box-shadow: 0 0 10px red; } 50% { transform: scale(1.1); box-shadow: 0 0 20px red; } 100% { transform: scale(1); box-shadow: 0 0 10px red; } }
        .emoji-btn { cursor:pointer; font-size:20px; transition:0.2s; filter:grayscale(1); padding:5px; border-radius:50%; }
        .emoji-btn:hover { transform:scale(1.3); filter:none; background:rgba(255,255,255,0.1); }
        .emoji-btn.active { filter:none; transform:scale(1.2); background:rgba(56,189,248,0.2); }
    </style>
</head>
<body>

    <div id="loginScreen">
        <div class="login-box">
            <h2 style="color:var(--accent); margin-top:0;">PERSONEL GİRİŞİ</h2>
            <p style="font-size:12px; color:#94a3b8; margin-bottom:25px;">Sadece size ait yayınlanan vardiyaları görebilirsiniz.</p>
            <input type="text" id="inpKurum" class="glass-input" placeholder="Kurum Kodu (Örn: addh)" value="addh">
            <input type="text" id="inpAd" class="glass-input" placeholder="Ad Soyad">
            <input type="password" id="inpTc" class="glass-input" placeholder="TC Kimlik (İlk 6 Hane)" maxlength="6">
            <button class="btn" onclick="girisYap()">SİSTEME GİR</button>
        </div>
    </div>

    <div id="dashboard">
        <div class="header">
            <div>
                <h2 style="margin:0; color:white;">YAYINLANAN VARDİYALARIM</h2>
                <span id="personelIsimSpan" style="color:var(--accent); font-size:14px; font-weight:800;"></span>
            </div>
            <div style="display:flex; gap:10px; flex-wrap:wrap;">
                <button onclick="openStaffMsgModal()" style="background:var(--purple); color:white; border:none; padding:8px 15px; border-radius:8px; font-weight:900; cursor:pointer; box-shadow:0 4px 15px rgba(139,92,246,0.5); transition:0.3s; display:flex; align-items:center; gap:5px;">
                    ✉️ YÖNETİCİYE TALEBİNİ İLET
                </button>
                <button id="btnInbox" onclick="openStaffInbox()" style="background:linear-gradient(135deg, #10b981, #059669); color:white; border:none; padding:8px 15px; border-radius:8px; font-weight:900; cursor:pointer; box-shadow:0 4px 15px rgba(16,185,129,0.5); transition:0.3s; display:flex; align-items:center; gap:5px;">
                    📬 TALEPLERİM VE YANITLAR
                </button>
                <button onclick="window.location.href='index.html'" style="background:rgba(255,255,255,0.1); color:white; border:1px solid rgba(255,255,255,0.2); padding:8px 15px; border-radius:8px; font-weight:bold; cursor:pointer; transition:0.3s;">🏠 ANA SAYFA</button>
                <button id="btnGuncelle" onclick="tablolariGuncelle()" style="background:#3b82f6; color:white; border:none; padding:8px 15px; border-radius:8px; font-weight:bold; cursor:pointer; box-shadow:0 4px 10px rgba(59,130,246,0.4); transition:0.3s;">🔄 GÜNCELLE</button>
                <button onclick="cikisYap()" style="background:#ef4444; color:white; border:none; padding:8px 15px; border-radius:8px; font-weight:bold; cursor:pointer; box-shadow:0 4px 10px rgba(239,68,68,0.4); transition:0.3s;">🚪 ÇIKIŞ</button>
            </div>
        </div>
        <div id="tablesContainer"></div>
    </div>

    <div id="staffMsgModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:99999; justify-content:center; align-items:center;">
        <div style="background:#1e293b; padding:20px; border-radius:15px; width:90%; max-width:400px; border:2px solid var(--purple); box-shadow:0 0 30px rgba(139,92,246,0.3);">
            <div style="display:flex; justify-content:space-between; margin-bottom:15px; border-bottom:1px solid #334155; padding-bottom:10px;">
                <b id="msgTargetName" style="color:white; font-size:15px;">TALEBİNİZİ YAZIN</b>
                <button onclick="document.getElementById('staffMsgModal').style.display='none'" style="background:none; border:none; color:white; font-size:20px; cursor:pointer;">✕</button>
            </div>
            <textarea id="staffMsgBody" style="width:100%; box-sizing:border-box; height:120px; background:#0f172a; color:white; border:1px solid #475569; border-radius:10px; padding:10px; margin-bottom:15px; font-family:'Poppins'; resize:none;" placeholder="Yöneticinize iletmek istediğiniz talebi detaylıca yazın..."></textarea>
            <button onclick="sendStaffMessage()" style="width:100%; background:var(--purple); color:white; font-weight:900; padding:15px; border:none; border-radius:10px; cursor:pointer; font-family:'Poppins'; font-size:14px; box-shadow:0 4px 15px rgba(139,92,246,0.4);">🚀 YÖNETİCİYE İLET</button>
        </div>
    </div>

    <div id="staffInboxModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:99999; justify-content:center; align-items:center;">
        <div style="background:#1e293b; padding:20px; border-radius:15px; width:90%; max-width:600px; border:2px solid #10b981; box-shadow:0 0 40px rgba(16,185,129,0.3); display:flex; flex-direction:column; max-height:85vh;">
            <div style="display:flex; justify-content:space-between; margin-bottom:15px; border-bottom:1px solid #334155; padding-bottom:10px;">
                <b style="color:white; font-size:18px;">📬 TALEPLERİM VE YANITLAR</b>
                <button onclick="document.getElementById('staffInboxModal').style.display='none'" style="background:none; border:none; color:white; font-size:20px; cursor:pointer;">✕</button>
            </div>
            <div id="staffInboxContainer" style="overflow-y:auto; flex:1; padding-right:5px; display:flex; flex-direction:column; gap:15px;">
                </div>
        </div>
    </div>
