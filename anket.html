<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sağlık Bakanlığı - Eğitim & Anket Sistemi</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
    <style>
        :root { --bg: #f8fafc; --primary: #3b82f6; --success: #10b981; --danger: #ef4444; --dark: #0f172a; --border: #e2e8f0; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Nunito', sans-serif; background: var(--bg); margin: 0; padding: 0; color: var(--dark); line-height: 1.6; }
        
        .header { background: white; padding: 20px; text-align: center; border-bottom: 2px solid var(--border); box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .logo { height: 60px; margin-bottom: 10px; }
        .container { max-width: 600px; margin: 20px auto; padding: 0 15px 100px 15px; }

        .card { background: white; border-radius: 15px; padding: 25px; border: 1px solid var(--border); box-shadow: 0 10px 25px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .anket-title { font-weight: 900; font-size: 22px; text-align: center; margin-bottom: 5px; color: var(--dark); }
        
        /* Eğitim PDF Alanı */
        #pdfArea { margin-bottom: 25px; }
        .pdf-frame { width: 100%; height: 400px; border: 2px solid var(--border); border-radius: 12px; }

        /* Soru Stilleri */
        .question-box { margin-bottom: 30px; }
        .question-text { font-weight: 800; font-size: 16px; margin-bottom: 15px; display: block; border-left: 4px solid var(--primary); padding-left: 10px; }
        
        /* Şık Butonları */
        .options-grid { display: grid; gap: 10px; }
        .opt-btn { 
            background: #f1f5f9; border: 2px solid var(--border); padding: 15px; border-radius: 12px; 
            font-weight: 800; cursor: pointer; transition: 0.2s; text-align: center; display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .opt-btn.selected { background: var(--primary); border-color: var(--primary); color: white; transform: scale(1.02); }
        .stars { display: flex; justify-content: space-around; }
        .star-btn { font-size: 28px; cursor: pointer; filter: grayscale(1); transition: 0.2s; }
        .star-btn.active { filter: grayscale(0); transform: scale(1.2); }

        .text-input { width: 100%; padding: 15px; border-radius: 12px; border: 2px solid var(--border); font-family: 'Nunito'; font-weight: 700; font-size: 15px; outline: none; }
        .text-input:focus { border-color: var(--primary); }

        .submit-btn { 
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: calc(100% - 30px); max-width: 570px;
            background: linear-gradient(135deg, #10b981, #059669); color: white; padding: 20px; border-radius: 15px; 
            font-weight: 900; font-size: 18px; border: none; cursor: pointer; box-shadow: 0 10px 30px rgba(16, 185, 129, 0.4);
        }
        
        #loading { text-align: center; padding: 50px; font-weight: 800; }
        #completed { text-align: center; padding: 50px; display: none; }
    </style>
</head>
<body>

    <div class="header">
        <img src="logo.png" class="logo" alt="T.C. Sağlık Bakanlığı">
        <div style="font-weight: 900; font-size: 14px; color: var(--danger);">DÖŞEMEALTI DEVLET HASTANESİ</div>
    </div>

    <div id="loading">Sistem Yükleniyor...</div>

    <div id="completed" class="container">
        <div class="card">
            <div style="font-size: 70px;">✅</div>
            <h2 style="font-weight: 900;">Teşekkür Ederiz!</h2>
            <p style="font-weight: 700; color: var(--text-gray);">Katılımınız başarıyla kaydedilmiştir. Bu sayfayı kapatabilirsiniz.</p>
        </div>
    </div>

    <div class="container" id="mainContent" style="display:none;">
        <h1 class="anket-title" id="baslik">Eğitim & Anket</h1>
        
        <div id="pdfArea" style="display: none;">
            <div class="card">
                <h4 style="margin: 0 0 10px 0;">📚 Eğitim Materyali</h4>
                <p style="font-size: 12px; margin-bottom: 15px;">Lütfen aşağıdaki materyali inceledikten sonra sorulara geçin.</p>
                <iframe id="pdfFrame" class="pdf-frame"></iframe>
                <a id="pdfLink" href="#" target="_blank" style="display:block; margin-top:10px; text-align:center; color:var(--primary); font-weight:900;">Tam Ekranda Aç</a>
            </div>
        </div>

        <div id="questionsContainer"></div>

        <button class="submit-btn" onclick="window.submitAnket()">📨 CEVAPLARI GÖNDER</button>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyAAqT74kCwyr6ZULTR_ClRDJ5Iu4AhmXJQ", databaseURL: "https://shiftmaster1-7fc5f-default-rtdb.europe-west1.firebasedatabase.app", projectId: "shiftmaster1-7fc5f" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let anketId = new URLSearchParams(window.location.search).get('id');
        let surveyData = null;
        let userAnswers = {};

        // 1. ANKETİ YÜKLE
        if(!anketId) { document.getElementById('loading').innerText = "Hata: Geçersiz Anket Linki!"; } 
        else if(localStorage.getItem('sub_' + anketId)) { 
            document.getElementById('loading').style.display = 'none';
            document.getElementById('completed').style.display = 'block';
        }
        else {
            db.ref("anketler/" + anketId).once("value").then(snap => {
                if(!snap.exists()) { document.getElementById('loading').innerText = "Anket bulunamadı veya silinmiş."; return; }
                surveyData = snap.val();
                buildSurvey();
            });
        }

        function buildSurvey() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';
            document.getElementById('baslik').innerText = surveyData.baslik;

            if(surveyData.pdfLink) {
                document.getElementById('pdfArea').style.display = 'block';
                document.getElementById('pdfFrame').src = surveyData.pdfLink;
                document.getElementById('pdfLink').href = surveyData.pdfLink;
            }

            const qCont = document.getElementById('questionsContainer');
            if(surveyData.sorular) {
                surveyData.sorular.forEach((s, idx) => {
                    let html = `<div class="card question-box"><span class="question-text">${idx+1}. ${s.metin}</span>`;
                    
                    if(s.tip === '1-5') {
                        html += `<div class="stars">`;
                        for(let i=1; i<=5; i++) {
                            html += `<span class="star-btn" data-q="${idx}" data-v="${i}" onclick="selectStar(this, ${idx}, ${i})">⭐</span>`;
                        }
                        html += `</div>`;
                    } 
                    else if(s.tip === 'evet-hayir') {
                        html += `<div class="options-grid">
                            <div class="opt-btn" data-q="${idx}" onclick="selectOpt(this, ${idx}, 'Evet')">🔘 Evet</div>
                            <div class="opt-btn" data-q="${idx}" onclick="selectOpt(this, ${idx}, 'Hayır')">🔘 Hayır</div>
                        </div>`;
                    }
                    else if(s.tip === 'katiliyorum') {
                        html += `<div class="options-grid">
                            <div class="opt-btn" data-q="${idx}" onclick="selectOpt(this, ${idx}, 'Katılıyorum')">🔘 Katılıyorum</div>
                            <div class="opt-btn" data-q="${idx}" onclick="selectOpt(this, ${idx}, 'Kısmen')">🔘 Kısmen</div>
                            <div class="opt-btn" data-q="${idx}" onclick="selectOpt(this, ${idx}, 'Katılmıyorum')">🔘 Katılmıyorum</div>
                        </div>`;
                    }
                    else {
                        html += `<textarea class="text-input" placeholder="Yorumunuzu buraya yazın..." oninput="userAnswers[${idx}]=this.value"></textarea>`;
                    }
                    
                    html += `</div>`;
                    qCont.innerHTML += html;
                });
            }
        }

        window.selectOpt = function(el, qIdx, val) {
            document.querySelectorAll(`.opt-btn[data-q="${qIdx}"]`).forEach(b => b.classList.remove('selected'));
            el.classList.add('selected');
            userAnswers[qIdx] = val;
        }

        window.selectStar = function(el, qIdx, val) {
            document.querySelectorAll(`.star-btn[data-q="${qIdx}"]`).forEach((s, i) => {
                s.classList.toggle('active', i < val);
            });
            userAnswers[qIdx] = val;
        }

        window.submitAnket = function() {
            let totalQ = surveyData.sorular ? surveyData.sorular.length : 0;
            if(Object.keys(userAnswers).length < totalQ) {
                return alert("Lütfen tüm soruları cevaplayın!");
            }

            const btn = document.querySelector('.submit-btn');
            btn.disabled = true; btn.innerText = "⏳ GÖNDERİLİYOR...";

            // Sonuçları Firebase'e "Ham Veri" olarak at (İstatistik için)
            db.ref("anket_sonuclari/" + anketId).push({
                cevaplar: userAnswers,
                tarih: new Date().toLocaleString('tr-TR'),
                cihaz: navigator.userAgent.substring(0, 50)
            }).then(() => {
                localStorage.setItem('sub_' + anketId, 'true'); // Mükerrer katılımı engelle
                document.getElementById('mainContent').style.display = 'none';
                document.getElementById('completed').style.display = 'block';
                window.scrollTo(0,0);
            });
        }
    </script>
</body>
</html>
